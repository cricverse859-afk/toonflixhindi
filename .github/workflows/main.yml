name: run-bot
on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"   # safety net: koi run na chal raha ho to naya utha deta hai

permissions:
  contents: read
  actions: write             # agla run dispatch karne ke liye zaroori

# NOTE: concurrency group jaan-boojh kar hata diya hai, taaki purana aur naya run
# ~1 ghante tak ek saath chal sakein (handover).

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          others=$(gh run list --workflow main.yml --status in_progress --limit 30 \
            --json databaseId --jq "[.[] | select(.databaseId != $RUN_ID)] | length" 2>/dev/null)
          others=${others:-0}
          echo "Event=$EVENT, doosre chalte runs=$others"
          go=true
          if [ "$EVENT" = "schedule" ] && [ "$others" -ge 1 ]; then go=false; fi   # cron: koi chal raha hai to skip
          if [ "$EVENT" != "schedule" ] && [ "$others" -ge 3 ]; then go=false; fi  # runaway se bachao
          echo "go=$go" >> "$GITHUB_OUTPUT"

  run:
    needs: guard
    if: needs.guard.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Start Cloudflare quick tunnel
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          nohup ./cloudflared tunnel --url http://localhost:8000 --no-autoupdate > tunnel.log 2>&1 &
          for i in $(seq 1 30); do
            URL=$(grep -o 'https://[-a-z0-9]*\.trycloudflare\.com' tunnel.log | grep -v '^https://api\.' | head -1)
            [ -n "$URL" ] && break
            sleep 2
          done
          [ -z "$URL" ] && { echo "Tunnel URL nahi mila"; cat tunnel.log; exit 1; }
          echo "ORIGIN_URL=$URL" >> $GITHUB_ENV
      - name: Run bot (crash par same run me restart + 1 ghante pehle handover)
        run: |
          set +e
          # ~290 min baad agla run start karo -> purana run 355 min par band hoga => ~1 ghanta overlap
          nohup bash -c '
            sleep 17400
            for t in 1 2 3; do
              gh workflow run main.yml && { echo "Handover: agla run start ho gaya"; break; }
              sleep 20
            done
          ' > handover.log 2>&1 &
          for i in $(seq 1 20); do
            python main.py
            code=$?
            [ $code -eq 0 ] && exit 0
            echo "Bot crash (exit $code) - 5s me dobara ($i/20)"
            sleep 5
          done
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          STORAGE_CHANNEL: ${{ secrets.STORAGE_CHANNEL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ALLOWED_USERS: ${{ secrets.ALLOWED_USERS }}
          FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
          BASE_URL: ${{ secrets.BASE_URL }}      # tumhare Worker ka fixed URL
          PORT: "8000"
          # purane links ka prefix (comma se alag). Purane links convert karne ke liye zaroori
          OLD_ROUTE_PREFIXES: toonflixhindi,toonflix
          # (optional) convert API sirf apni site se: PLAYER_ORIGINS: https://tumhari-site.com
